name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Vet and Test
        run: |
          go vet ./...
          go test -v -race ./...
      - name: Build Static Binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/kubelite-linux-amd64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/kubelite-darwin-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: kubelite-binaries
          path: dist/kubelite-*
